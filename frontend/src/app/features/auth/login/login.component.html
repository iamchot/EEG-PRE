<div class="auth-page">
  <div class="auth-bg" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
  </div>
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="auth-logo-wrap" aria-hidden="true">
        <span class="auth-logo-text">🧠</span>
      </div>
      <h1>Dream Comicverse</h1>
      <p>Login to explore your subconscious</p>
    </div>
    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <div class="input-wrap">
          <input
            id="login-email"
            type="email"
            class="form-input"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <div class="input-wrap">
          <input
            id="login-password"
            type="password"
            class="form-input"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>
      </div>
      @if (error()) {
        <div class="alert-error" role="alert" aria-live="polite">
          <span>{{ error() }}</span>
        </div>
      }
      <button type="submit" class="btn btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        <span>{{ loading() ? "กำลังเข้าสู่ระบบ..." : "เข้าสู่ระบบ" }}</span>
      </button>
    </form>
    <div class="auth-footer">
      <p>
        ยังไม่มีบัญชี?
        <a routerLink="/register" id="link-register">สมัครสมาชิก</a>
      </p>
    </div>
  </div>
</div>
